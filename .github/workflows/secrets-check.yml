name: Secrets Check
on:
  workflow_dispatch: {}
  push:
    branches: [ main ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify required secrets are set
        env:
          REQ: CF_API_TOKEN,CF_ACCOUNT_ID,FIREBASE_PROJECT_ID,FIREBASE_SA,SEVENUE_HMAC_SECRET,LOOKER_BQ_DATASET
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          SEVENUE_HMAC_SECRET: ${{ secrets.SEVENUE_HMAC_SECRET }}
          LOOKER_BQ_DATASET: ${{ secrets.LOOKER_BQ_DATASET }}
        run: |
          missing=()
          IFS=',' read -ra keys <<< "$REQ"
          for k in "${keys[@]}"; do
            val="${!k}"
            if [ -z "$val" ]; then
              missing+=("$k")
            fi
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "❌ Missing secrets: ${missing[*]}"
            exit 1
          fi
          echo "✅ All required secrets are present.",
